name: gg_version
description: A dart package offering methods for consistent versioning of dart packages..
version: 5.3.1
repository: https://github.com/inlavigo/gg_version.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  checked_yaml: ^2.0.4
  gg_args: ^3.1.1
  gg_console_colors: ^2.4.0
  gg_git: ^4.2.1
  gg_lang: ^0.6.1
  gg_log: ^1.2.0
  gg_process: ^1.2.0
  gg_status_printer: ^1.5.1
  meta: ^1.19.0
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.1
  pubspec_parse: ^1.6.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  gg_capture_print: ^1.1.0
  lints: ^6.1.0
  test: ^1.31.2
  recase: ^4.1.0
  dna_ggsuite: ^0.2.0
  helix: ^1.2.1
