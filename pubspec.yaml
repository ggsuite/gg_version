version: 4.6.0
repository: https://github.com/inlavigo/gg_version.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  args: ^2.7.0
  checked_yaml: ^2.0.4
  gg_args: ^2.2.0
  gg_console_colors: ^2.3.0
  gg_git: ^3.2.1
