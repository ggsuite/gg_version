  pubspec_parse: ^1.5.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  gg_capture_print: ^1.0.9
  lints: ^6.1.0
  test: ^1.31.2
  recase: ^4.1.0